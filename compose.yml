services:
    web:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                PHP_IMAGE_TAG: ${PHP_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-web
        ports:
            - "${WEB_PORT}:80"
        volumes:
            - ./laravel:/var/www:delegated
            - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
        environment:
            TZ: ${TZ}
        depends_on:
            - db
            - redis

    node:
        image: node:${NODE_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-node
        working_dir: /var/www
        volumes:
            - ./laravel:/var/www:delegated
        ports:
            - "${VITE_PORT}:5173"
        environment:
            TZ: ${TZ}
        command: bash -lc "corepack enable && tail -f /dev/null"

    db:
        image: mysql:${MYSQL_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-db
        ports:
            - "${DB_PORT}:3306"
        environment:
            TZ: ${TZ}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci

    redis:
        image: redis:${REDIS_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-redis
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis_data:/data

    mailpit:
        image: axllent/mailpit:${MAILPIT_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-mailpit
        ports:
            - "${MAILPIT_SMTP_PORT}:1025"
            - "${MAILPIT_HTTP_PORT}:8025"

volumes:
    db_data:
    redis_data:
